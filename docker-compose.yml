# The Software License Manager runs its own API and its own PostgreSQL instance.
# It never connects to the Core Hub database - only to the Core Hub JWKS URL.
services:
  csmju-software-license-manager-db:
    image: postgres:16-alpine
    container_name: csmju-software-license-manager-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: csmju_software_license_manager_db
    ports:
      # 5434 on the host so it cannot collide with a Core Hub database on 5432
      - '5434:5432'
    volumes:
      - csmju-csmju-software-license-manager-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d csmju_software_license_manager_db']
      interval: 5s
      timeout: 5s
      retries: 10

  csmju-software-license-manager-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: csmju-software-license-manager-api
    restart: unless-stopped
    depends_on:
      csmju-software-license-manager-db:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3002
      DATABASE_URL: postgresql://postgres:postgres@csmju-software-license-manager-db:5432/csmju_software_license_manager_db
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-5}
      # The Core Hub usually runs on the host machine during local development.
      CORE_HUB_URL: ${CORE_HUB_URL:-http://host.docker.internal:3000}
      CORE_HUB_JWKS_URL: ${CORE_HUB_JWKS_URL:-http://host.docker.internal:3000/api/v1/.well-known/jwks.json}
      CORE_HUB_ISSUER: ${CORE_HUB_ISSUER:-core-hub}
      CORE_HUB_AUDIENCE: ${CORE_HUB_AUDIENCE:-csmju2030}
      SUBSYSTEM_ID: ${SUBSYSTEM_ID:-csmju-software-license-manager}
      SUBSYSTEM_NAME: ${SUBSYSTEM_NAME:-CSMJU Software License Manager}
    ports:
      - '3002:3002'
    extra_hosts:
      # Lets the container reach a Core Hub running on the host (Linux support)
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3002/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  csmju-software-license-manager-web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: csmju-software-license-manager-web
    restart: unless-stopped
    depends_on:
      csmju-software-license-manager-api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      BACKEND_URL: http://csmju-software-license-manager-api:3002
      PORT: 3200
      HOSTNAME: 0.0.0.0
    ports:
      - '3200:3200'

volumes:
  csmju-csmju-software-license-manager-db-data: