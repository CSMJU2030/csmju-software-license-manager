# Local deployment for CSMJU Software License Manager.
# Service names and container ports follow standards/docs/deployment.md:
#   db  -> PostgreSQL
#   api -> NestJS :4000
#   web -> Next.js :3000
#
# The browser uses http://localhost:3200 during local development.
# Next.js rewrites /api/* and /auth/* to http://api:4000 at build time.

services:
  db:
    image: postgres:16-alpine
    container_name: csmju-software-license-manager-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: csmju_software_license_manager_db
    ports:
      # Local development only.
      - '5434:5432'
    volumes:
      - csmju-csmju-software-license-manager-db-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U postgres -d csmju_software_license_manager_db',
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: csmju-software-license-manager-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/csmju_software_license_manager_db
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-5}

      CORE_HUB_URL: ${CORE_HUB_URL:-http://host.docker.internal:3000}
      CORE_HUB_JWKS_URL: ${CORE_HUB_JWKS_URL:-http://host.docker.internal:3000/api/v1/.well-known/jwks.json}
      CORE_HUB_WEB_URL: ${CORE_HUB_WEB_URL:-http://localhost:3100}

      CORE_HUB_ISSUER: ${CORE_HUB_ISSUER:-core-hub}
      CORE_HUB_AUDIENCE: ${CORE_HUB_AUDIENCE:-csmju2030}

      SUBSYSTEM_ID: ${SUBSYSTEM_ID:-csmju-software-license-manager}
      SUBSYSTEM_NAME: ${SUBSYSTEM_NAME:-CSMJU Software License Manager}

      TZ: Asia/Bangkok
    ports:
      # Local development only.
      - '4000:4000'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m
    mem_limit: 512m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: csmju-software-license-manager-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      CORE_HUB_WEB_URL: ${CORE_HUB_WEB_URL:-http://localhost:3100}
      SUBSYSTEM_ID: ${SUBSYSTEM_ID:-csmju-software-license-manager}
      TZ: Asia/Bangkok
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m
      - /app/frontend/.next/cache:size=64m
    mem_limit: 384m
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    ports:
      # Host port 3200 -> standard container port 3000.
      - '127.0.0.1:3200:3000'

volumes:
  csmju-csmju-software-license-manager-db-data: