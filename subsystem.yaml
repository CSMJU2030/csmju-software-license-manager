# manifest ของระบบย่อย — CI และ conformance อ่านไฟล์นี้ไฟล์เดียว
# schema: standards/schemas/subsystem.schema.json

name: csmju-software-license-manager          # ต้องตรงกับทะเบียนใน Core Hub และกับ data.service ของ /api/health
standards_version: "1.0.0"
conformance_level: L3                 # L1 · L2 · L3 (ระบบที่มี UI ต้องถึง L3)

base_url: http://localhost:3002       # URL ของระบบย่อยตอนรันเพื่อทดสอบ
core_hub_url: http://localhost:3000
callback_path: /auth/callback         # ต้องตรงกับ callback_url ที่ลงทะเบียนไว้

public_endpoints:
  - GET /api/health
  - GET /auth/callback

# conformance ใช้ probes ตรวจสัญญา API — ประกาศไม่ครบ = ขึ้น SKIP = ยังไม่ผ่าน
probes:
  collection: /api/v1/software-licenses
  not_found: /api/v1/software-licenses/99999999-9999-4999-8999-999999999999
  invalid_id: /api/v1/software-licenses/not-a-uuid
  create:
    path: /api/v1/software-licenses
    allowed_role: staff
    denied_role: student
    invalid_body:
      softwareName: ""
      licenseQuantity: 0
      expiryDate: "not-a-date"
    valid_body:
      softwareName: "Conformance Test Software"
      provider: "Test Provider"
      licenseType: "Subscription"
      licenseQuantity: 1
      expiryDate: "2027-10-04T00:00:00.000Z"
      cost: 100
      currency: "THB"

owners:
  pl: "@csmju2030/pl-software-license-manager"
  aie: "@csmju2030/aie-software-license-manager"

display_name: "CS Software License Manager"
repo: github.com/CSMJU2030/csmju-software-license-manager

default_role_mapping:
  admin: LICENSE_ADMIN
  staff: LICENSE_EDITOR
  alumni: VIEWER
  student: VIEWER

approval_status: APPROVED
status: ACTIVE
